# Builds the Vietnamese MP3s and publishes the app to GitHub Pages on every push to main.
name: Build audio and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The key gets the run id so a partial build can be saved too; restore takes the newest matching one.
      - name: Cache key
        id: key
        run: echo "base=mp3-${{ hashFiles('audio/tracks.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore MP3 cache
        uses: actions/cache/restore@v4
        with:
          path: audio/mp3
          key: ${{ steps.key.outputs.base }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.key.outputs.base }}-
            mp3-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install edge-tts==7.3.1
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Few TTS calls at a time: Microsoft's free voice service throttles bursts ("No audio was received").
      - name: Build MP3s (only new or changed tracks)
        id: build
        env:
          TTS_CONCURRENCY: "2"
        run: python tools/build_audio.py

      # Save even if the build step failed, so finished MP3s are not made again on the next run.
      - name: Save MP3 cache
        if: always() && steps.build.conclusion != 'skipped' && steps.build.outputs.made != '0'
        uses: actions/cache/save@v4
        with:
          path: audio/mp3
          key: ${{ steps.key.outputs.base }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest qbank.js icons audio _site/
          rm -f _site/audio/.gitkeep
          du -sh _site _site/audio/mp3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
