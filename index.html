<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-F Practice</title>
<meta name="description" content="Luyện thi CCAR-F trên iPhone: practice, mock exams, flashcards, audio tiếng Việt.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCAR-F">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#5b6475; --line:#e2e6ee;
  --brand:#2742c9; --brand-soft:#e6ebff; --ok:#13804a; --ok-soft:#e3f6ec; --bad:#c2352b; --bad-soft:#fdeceb;
  --warn:#9a6400; --warn-soft:#fff4dc; --vn:#7a3fb8; --vn-soft:#f3ebfc; --bar:#ffffffee;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#151b2e; --ink:#e8ecf6; --muted:#98a2b8; --line:#273049;
  --brand:#8ea2ff; --brand-soft:#1f2a55; --ok:#4cd391; --ok-soft:#123326; --bad:#ff8a80; --bad-soft:#3a1a1a;
  --warn:#f5c35a; --warn-soft:#3a2d10; --vn:#c9a2f5; --vn-soft:#2b1f40; --bar:#151b2eee; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#151b2e; --ink:#e8ecf6; --muted:#98a2b8; --line:#273049;
  --brand:#8ea2ff; --brand-soft:#1f2a55; --ok:#4cd391; --ok-soft:#123326; --bad:#ff8a80; --bad-soft:#3a1a1a;
  --warn:#f5c35a; --warn-soft:#3a2d10; --vn:#c9a2f5; --vn-soft:#2b1f40; --bar:#151b2eee; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 0;min-height:100vh;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:22px 0 8px}
h3{font-size:1rem;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-size:1.6rem;font-weight:700;line-height:1.1}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;min-height:46px;
  background:var(--brand);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
:root[data-theme="dark"] .btn,.dark-btn{color:#0b1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b1020}}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.bad{background:var(--bad-soft);color:var(--bad)} .btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.block{width:100%} .btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0b1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0b1020}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.tag.vn{background:var(--vn-soft);color:var(--vn)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.vn{color:var(--vn);font-size:.94rem;margin-top:4px}
code{font:.88em ui-monospace,Menlo,monospace;background:var(--brand-soft);padding:1px 5px;border-radius:5px;word-break:break-word}
.q{font-size:1.04rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;font:inherit;display:flex;gap:10px;align-items:flex-start;min-height:48px}
.opt b.l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:.9rem}
.opt.pick{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right b.l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong b.l{background:var(--bad);color:#fff}
.opt .vn{display:block}
.expl{border-left:4px solid var(--brand);padding:8px 12px;background:var(--brand-soft);border-radius:0 12px 12px 0;margin:10px 0}
details summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:.92rem}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--brand)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 5px;min-width:17px;line-height:17px}
.player{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:19;max-width:624px;margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player .t{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{border:0;background:var(--brand-soft);color:var(--brand);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:inherit;font-weight:700;flex:none}
.pbtn.main{background:var(--brand);color:#fff;width:50px;height:50px}
input[type=range]{width:100%;accent-color:var(--brand)}
.trk{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk .tt{flex:1;min-width:0;font-size:.93rem}
.trk.now .tt{color:var(--brand);font-weight:700}
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;transition:transform .15s}
.flash .term{font-size:1.5rem;font-weight:700}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.navgrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:42px;font:inherit;font-weight:600}
.navgrid button.ans{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft)}
.navgrid button.fl{box-shadow:inset 0 -4px 0 var(--warn)}
.navgrid button.cur{outline:2px solid var(--brand)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.55);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.toggle{width:52px;height:31px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--ok)} .toggle.on::after{left:24px}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:.92rem}
.center{text-align:center}
a{color:var(--brand)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:1.2rem;display:grid;place-items:center;flex:none}
.iconbtn.sm{width:30px;height:30px;font-size:.85rem;border:0;background:transparent;color:inherit}
.hero{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:2rem;line-height:1}.ringtxt span{font-size:.75rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats3>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stats3 b{font-size:1.15rem}.stats3 small{font-size:.75rem;color:var(--muted);font-weight:500}.stats3 span{font-size:.72rem;color:var(--muted)}
button.card{width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.next{display:flex;flex-direction:column;gap:2px;border-color:var(--brand);background:var(--brand-soft)}
.next b{font-size:1.08rem;color:var(--brand)}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;border:0;background:none;font:inherit;color:var(--ink);text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-of-type{border-bottom:0}
.drow .dl{font-size:.92rem}.drow .dv{font-weight:700;font-size:.92rem}
.drow .bar{grid-column:1 / -1;height:6px}
.drow.pick1.sel .dl b,.drow.pick1.sel .dl{color:var(--brand);font-weight:700}
.drow.pick1.sel{background:var(--brand-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.mocks4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mocks4 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;font:inherit}
.mocks4 b{font-size:1.1rem}.okc{color:var(--ok)}.badc{color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font:inherit;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.vnbox{background:var(--vn-soft);color:var(--vn);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:.93rem}
.vnbox summary{color:var(--vn)}
.vnbox p{margin:6px 0}
.expl.good{border-left-color:var(--ok);background:var(--ok-soft)}.expl.badx{border-left-color:var(--bad);background:var(--bad-soft)}
.doc h2{font-size:1.2rem;line-height:1.35}
.sumbox{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-weight:600;font-size:.95rem}
.sect{margin:20px 0 6px}
.gi{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.gi p{margin:2px 0}.gi .en{font-size:.95rem}
.notes{padding-left:20px}.notes li{margin:8px 0}.notes .vn{display:inline;font-size:.9rem}
.scen{margin:2px 0 8px}.scen summary{color:var(--muted)}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<div id="player" class="player" hidden></div>
<nav class="tabs" id="tabs"></nav>
<audio id="au" preload="metadata" playsinline></audio>
<script src="qbank.js"></script>
<script>
"use strict";
/* ========== Data ========== */
const {SCEN, EXAMS, Q, DOMAINS, GLOSS, LESSONS, GUIDE} = window.CCARF;
const PLAN_URL = "https://claude.ai/artifact/5smrFLP66m1zuGhDWwfiba";
const ALL = [];
Object.keys(Q).forEach(e => Q[e].forEach((q, i) => { q.id = e + "-" + i; q.ex = +e; q.i = i; ALL.push(q); }));
const DAY_DOMAIN = {}; LESSONS.forEach(l => DAY_DOMAIN[l.day] = l.d);
const LET = "ABCDE", PASS = 720, EXAM_SEC = 120 * 60;
const INT = [0, 0, 1, 3, 7, 14];          // Leitner box -> days until next review

/* ========== Storage ========== */
const KEY = "ccarf-app-v1";
function load() { let s = {}; try { s = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  return Object.assign({qs: {}, mocks: {}, cards: {}, days: [], showVN: true, listen: {}, rate: 1}, s); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ========== Helpers ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");
const gloss = t => String(t).replace(/\[\[([^\]]+)\]\]/g, '<span class="vn">($1)</span>');
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (c, t) => t ? Math.round(c / t * 100) : 0;
const clock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 3600) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60); };
const sameSet = (a, b) => a && b && a.length === b.length && a.every(x => b.includes(x));
const dname = d => `D${d} · ${DOMAINS[d][0]}`;
function toast(msg) { const t = document.createElement("div"); t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:90vw";
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function markActive() { const t = today(); if (S.days[S.days.length - 1] !== t) { S.days.push(t); if (S.days.length > 400) S.days = S.days.slice(-400); } }
function streak() { const set = new Set(S.days); let d = today(), n = 0; if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { n++; d = addDays(d, -1); } return n; }

/* Spaced repetition for questions: a wrong answer puts the question in box 1 (due today). */
function record(q, ok) {
  const r = S.qs[q.id] || (S.qs[q.id] = {n: 0, c: 0}); r.n++; if (ok) r.c++; r.last = ok ? 1 : 0;
  if (!ok) { r.box = 1; r.due = today(); }
  markActive(); save();
}
function reviewResult(q, ok) {
  const r = S.qs[q.id] || (S.qs[q.id] = {n: 0, c: 0}); r.n++; if (ok) r.c++; r.last = ok ? 1 : 0;
  if (ok) { r.box = (r.box || 1) + 1; if (r.box > 5) { delete r.box; delete r.due; r.mastered = 1; } else r.due = addDays(today(), INT[r.box]); }
  else { r.box = 1; r.due = addDays(today(), 1); }
  markActive(); save();
}
const dueQs = () => ALL.filter(q => { const r = S.qs[q.id]; return r && r.box && r.due <= today(); });
const wrongDeck = () => ALL.filter(q => { const r = S.qs[q.id]; return r && r.box; });
const cardKey = g => g[1];
const dueCards = () => GLOSS.filter(g => { const c = S.cards[cardKey(g)]; return !c || c.due <= today(); });

function domainStats() {
  const m = {}; Object.keys(DOMAINS).forEach(d => m[d] = {c: 0, n: 0, seen: 0, total: 0});
  ALL.forEach(q => { const r = S.qs[q.id], x = m[q.d]; x.total++; if (r) { x.seen++; x.c += r.c; x.n += r.n; } });
  return m;
}

/* ========== Router & tabs ========== */
const TABS = [
  ["home", "Home", '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ["practice", "Luyện", '<path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/>'],
  ["mock", "Thi thử", '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'],
  ["listen", "Học", '<path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>'],
  ["cards", "Thẻ", '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>'],
];
let view = {tab: "home"};
let timerId = null;
function go(v) { stopTimer(); view = v; render(); window.scrollTo(0, 0); }
function renderTabs() {
  const due = dueQs().length;
  $("#tabs").innerHTML = TABS.map(([k, label, ic]) => `<button data-tab="${k}" class="${view.tab === k ? "on" : ""}" aria-label="${label}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${label}
    ${k === "practice" && due ? `<span class="badge">${due}</span>` : ""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (view.tab === "mock" && view.mode === "exam") { pauseExam(); }
    go({tab: b.dataset.tab});
  });
  const inExam = view.tab === "mock" && view.mode === "exam";
  $("#tabs").style.display = inExam ? "none" : "";
}
function render() {
  document.documentElement.dataset.theme = S.theme || "";
  renderTabs();
  ({home: Home, practice: Practice, mock: Mock, listen: Listen, cards: Cards})[view.tab]();
  renderPlayer();
}

/* ========== Shared question renderer ========== */
function vnBtn() { return `<button class="chip ${S.showVN ? "on" : ""}" id="vnT" aria-label="Vietnamese">VN</button>`; }
function bindVN(after) { const b = $("#vnT"); if (b) b.onclick = () => { S.showVN = !S.showVN; save(); after(); }; }
// English stays clean; the Vietnamese translation sits in one folded block under the options.
function qHTML(q, picked, checked) {
  const multi = q.a.length > 1;
  return `<p class="q">${fmt(q.q)}</p>
  ${multi ? `<p><span class="tag warn">Choose TWO · chọn 2</span></p>` : ""}
  <div class="opts">${q.o.map((o, k) => {
    let cls = picked.includes(k) ? "pick" : "";
    if (checked) cls = q.a.includes(k) ? "right" : (picked.includes(k) ? "wrong" : "");
    return `<button class="opt ${cls}" data-k="${k}" ${checked ? "disabled" : ""}><b class="l">${LET[k]}</b><span>${fmt(o)}</span></button>`;
  }).join("")}</div>
  ${S.showVN ? `<details class="vnbox" ${S.vnOpen ? "open" : ""}><summary>Bản dịch tiếng Việt</summary>
    <p>${fmt(q.vi)}</p>${q.ov.map((o, k) => `<p><b>${LET[k]}.</b> ${fmt(o)}</p>`).join("")}</details>` : ""}`;
}
function bindVNBox() { document.querySelectorAll(".vnbox").forEach(d => d.ontoggle = () => { S.vnOpen = d.open; save(); }); }
function explHTML(q, picked) {
  const ok = sameSet(picked, q.a);
  return `<div class="expl ${ok ? "good" : "badx"}"><p><b>${ok ? "✓ Đúng rồi" : "✗ Chưa đúng"}</b> · Đáp án ${q.a.map(k => LET[k]).join(", ")}</p>

function estimate() {   // weighted by the exam blueprint, only once there is enough data
  const ds = domainStats(); let w = 0, acc = 0, n = 0;

  return n >= 20 ? Math.round(acc / w * 1000) : null;
}

    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 60 60)"/>
    <line x1="60" y1="2" x2="60" y2="14" stroke="var(--muted)" stroke-width="2" transform="rotate(${PASS / 1000 * 360} 60 60)"/></svg>`;

/* ========== Flashcards ========== */
let C = null, cf = 0;   // cf: 0 = all days, 1-5 = one study day, -1 = "chưa nhớ" only
function Cards() {
  if (C) return cardQ();
  const counts = d => { const deck = GLOSS.filter(g => !d || g[0] === d); return [deck.length, deck.filter(g => { const c = S.cards[cardKey(g)]; return !c || c.due <= today(); }).length]; };
  const weak = GLOSS.filter(g => (S.cards[cardKey(g)] || {}).box === 1).length;
  const known = GLOSS.filter(g => (S.cards[cardKey(g)] || {}).box >= 3).length;
  $("#app").innerHTML = `<h1>Flashcards (thẻ ghi nhớ)</h1>
   <p class="muted small">Thẻ hiện thuật ngữ tiếng Anh. Tự nói nghĩa tiếng Việt, rồi chạm để lật. Vuốt phải = nhớ rồi, vuốt trái = chưa nhớ.</p>
   <div class="grid2"><div class="card"><div class="muted small">Đã thuộc</div><div class="stat">${known}<span class="muted small"> / ${GLOSS.length}</span></div></div>
     <div class="card"><div class="muted small">Chưa nhớ</div><div class="stat">${weak}</div></div></div>
   <h2>Chọn bộ thẻ</h2>
   <div class="card">${[0, 1, 2, 3, 4, 5].map(d => { const [n, due] = counts(d);
     return `<div class="trk"><div class="tt"><b>${d ? `Day ${d} · D${DAY_DOMAIN[d]}` : "Tất cả"}</b><div class="muted small">${d ? esc(DOMAINS[DAY_DOMAIN[d]][1]) + " · " : ""}${n} thẻ · ${due} cần ôn</div></div>
       <button class="btn sec" data-cd="${d}" ${due ? "" : "disabled"}>Học</button></div>`; }).join("")}
     <div class="trk"><div class="tt"><b>Chỉ thẻ “chưa nhớ”</b><div class="muted small">${weak} thẻ</div></div><button class="btn bad" data-cd="-1" ${weak ? "" : "disabled"}>Học</button></div></div>`;
  document.querySelectorAll("[data-cd]").forEach(b => b.onclick = () => {
    const d = +b.dataset.cd;
    const deck = d === -1 ? GLOSS.filter(g => (S.cards[cardKey(g)] || {}).box === 1) : GLOSS.filter(g => (!d || g[0] === d) && (() => { const c = S.cards[cardKey(g)]; return !c || c.due <= today(); })());
    C = {list: shuffle(deck), cur: 0, flip: false, ok: 0, total: deck.length}; Cards();
  });
}
function cardQ() {
  if (C.cur >= C.list.length) {
    $("#app").innerHTML = `<h1>Xong bộ thẻ 🎉</h1><div class="card center"><div class="stat">${C.ok}/${C.total}</div><p class="muted">nhớ ngay lần đầu</p></div>
      <button class="btn block" id="cBack">Về danh sách thẻ</button>`;
    C = null; markActive(); save(); $("#cBack").onclick = () => Cards(); return;
  }
  const g = C.list[C.cur];
  $("#app").innerHTML = `<div class="top row" style="justify-content:space-between"><button class="chip" id="cX">✕ Thoát</button><span class="small"><b>${C.cur + 1}</b>/${C.list.length}</span><span class="tag">Day ${g[0]} · D${DAY_DOMAIN[g[0]]}</span></div>
   <div class="card flash" id="fc" style="margin-top:16px">${C.flip
     ? `<div class="term" style="font-size:1.15rem">${esc(g[1])}</div><p class="vn" style="font-size:1.15rem;margin-top:12px">${esc(g[2])}</p>`
     : `<div class="term">${esc(g[1])}</div><p class="muted small" style="margin-top:14px">Chạm để lật (tap to flip)</p>`}</div>
   ${C.flip ? `<div class="grid2"><button class="btn bad" id="cNo">✗ Chưa nhớ</button><button class="btn ok" id="cYes">✓ Nhớ rồi</button></div>` : `<button class="btn sec block" id="cFlip">Lật thẻ</button>`}`;
  $("#cX").onclick = () => { C = null; Cards(); };
  const flip = () => { C.flip = true; cardQ(); };
  $("#fc").onclick = () => { if (!C.flip) flip(); };
  if ($("#cFlip")) $("#cFlip").onclick = flip;
  const answer = ok => {
    const k = cardKey(g), c = S.cards[k] || (S.cards[k] = {box: 0});
    if (ok) { c.box = Math.min(5, (c.box || 0) + 1); c.due = addDays(today(), INT[c.box] || 1); if (!g._again) C.ok++; }
    else { c.box = 1; c.due = today(); g._again = 1; C.list.push(g); }
    save(); C.cur++; C.flip = false; cardQ();
  };
  if ($("#cNo")) { $("#cNo").onclick = () => answer(false); $("#cYes").onclick = () => answer(true); }
  // Swipe: right = remember, left = not yet (only after flipping).
  let x0 = null; const fc = $("#fc");
  fc.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive: true});
  fc.addEventListener("touchmove", e => { if (x0 != null && C.flip) fc.style.transform = `translateX(${(e.touches[0].clientX - x0) * .6}px) rotate(${(e.touches[0].clientX - x0) / 40}deg)`; }, {passive: true});
  fc.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; fc.style.transform = "";
    if (!C.flip) return; if (dx > 80) answer(true); else if (dx < -80) answer(false); });
}

      <button class="pbtn" data-play="${k}" aria-label="play">${cur && cur.id === t.id && !au.paused ? "❚❚" : "▶"}</button>
      <div class="tt">${esc(t.title)}<div class="muted small">D${t.d}${t.sec ? " · " + Math.round(t.sec / 60) + " phút" : ""}${(S.listen[t.id] || {}).done ? " · ✓ đã nghe" : ""}</div></div></div>`).join("")
     : `<p class="muted">${lf.cat === "quiz" && lf.wrongOnly ? "Bạn chưa có câu sai nào trong danh sách ôn." : "Không có bài nào."}</p>`}</div>
   ${cur ? `<details class="card"><summary>Lời đọc bài đang phát (transcript)</summary>${cur.segs.filter(s => s[0] !== "pause").map(s => `<p class="${s[0] === "en" ? "" : "small"}">${s[0] === "en" ? "<b>" + esc(s[1]) + "</b>" : esc(s[1])}</p>`).join("")}</details>` : ""}`;
  bindLH();
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { lf.cat = b.dataset.cat; Listen(); });
  document.querySelectorAll("[data-ld]").forEach(b => b.onclick = () => { lf.d = +b.dataset.ld; Listen(); });
  document.querySelectorAll("[data-le]").forEach(b => b.onclick = () => { lf.ex = +b.dataset.le; Listen(); });
  if ($("#lW")) $("#lW").onclick = () => { lf.wrongOnly = !lf.wrongOnly; Listen(); };
  $("#lPlay").onclick = () => playList(list, 0);
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => {
    const k = +b.dataset.play, t = list[k];
    if (cur && cur.id === t.id) { au.paused ? au.play() : au.pause(); return; }
    playList(list, k);
  });
  $("#lDl").onclick = () => downloadList(list);
}
function playList(list, k) { PL = {list: list.slice(), idx: k}; playIdx(); }
function playIdx() {
  const t = PL.list[PL.idx]; if (!t) return;
  au.src = t.file; au.playbackRate = S.rate || 1;
  const pos = (S.listen[t.id] || {}).pos;
  au.addEventListener("loadedmetadata", function f() { au.removeEventListener("loadedmetadata", f); au.playbackRate = S.rate || 1; if (pos && pos < au.duration - 5) au.currentTime = pos; }, {once: true});
  au.play().catch(() => toast("Chưa có file audio này. Audio có thể đang được tạo, thử lại sau."));
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({title: t.title, artist: "CCAR-F · " + DOMAINS[t.d][1], album: CATS.find(c => c[0] === t.cat)[1],
      artwork: [{src: "icons/icon-512.png", sizes: "512x512", type: "image/png"}]});
  }
  markActive(); save(); refreshListen();
}
function refreshListen() { renderPlayer(); if (view.tab === "listen" && TR) { const y = window.scrollY; Listen(); window.scrollTo(0, y); } }
au.addEventListener("ended", () => { const t = PL.list[PL.idx]; if (t) { S.listen[t.id] = {done: 1}; save(); }
  if (PL.idx + 1 < PL.list.length) { PL.idx++; playIdx(); } else refreshListen(); });
au.addEventListener("play", refreshListen); au.addEventListener("pause", () => { savePos(); refreshListen(); });
let lastSave = 0;
au.addEventListener("timeupdate", () => { const p = $("#pPos"); if (p && au.duration) { p.max = au.duration; p.value = au.currentTime; $("#pTime").textContent = clock(au.currentTime).slice(2) + " / " + clock(au.duration).slice(2); }
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); savePos(); } });
function savePos() { const t = PL.list[PL.idx]; if (t && au.currentTime > 3) { S.listen[t.id] = Object.assign(S.listen[t.id] || {}, {pos: au.currentTime}); save(); } }
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  try { ms.setActionHandler("play", () => au.play()); ms.setActionHandler("pause", () => au.pause());
    ms.setActionHandler("previoustrack", () => { if (PL.idx > 0) { PL.idx--; playIdx(); } });
    ms.setActionHandler("nexttrack", () => { if (PL.idx + 1 < PL.list.length) { PL.idx++; playIdx(); } });
    ms.setActionHandler("seekbackward", () => au.currentTime = Math.max(0, au.currentTime - 15));
    ms.setActionHandler("seekforward", () => au.currentTime = au.currentTime + 15);
  } catch (e) {}
}
function renderPlayer() {
  const el = $("#player"), t = PL.list[PL.idx];
  const hide = !t || (view.tab === "mock" && view.mode === "exam");
  el.hidden = hide; if (hide) return;
  el.innerHTML = `<div class="t">${esc(t.title)}</div>
   <input type="range" id="pPos" min="0" max="${au.duration || 1}" step="1" value="${au.currentTime || 0}">
   <div class="row" style="justify-content:space-between"><span class="muted small" id="pTime"></span>
    <div class="row" style="gap:8px"><button class="pbtn" id="pPrev" aria-label="previous">⏮</button><button class="pbtn" id="pBack" aria-label="back 15s">↺15</button>
     <button class="pbtn main" id="pPlay" aria-label="play">${au.paused ? "▶" : "❚❚"}</button><button class="pbtn" id="pNext" aria-label="next">⏭</button>
     <button class="pbtn" id="pRate" style="font-size:.8rem">${S.rate || 1}×</button></div></div>`;
  $("#pPlay").onclick = () => au.paused ? au.play() : au.pause();
  $("#pPrev").onclick = () => { if (PL.idx > 0) { PL.idx--; playIdx(); } };
  $("#pNext").onclick = () => { if (PL.idx + 1 < PL.list.length) { PL.idx++; playIdx(); } };
  $("#pBack").onclick = () => au.currentTime = Math.max(0, au.currentTime - 15);
  $("#pRate").onclick = () => { const r = [1, 1.25, 1.5, 0.85]; S.rate = r[(r.indexOf(S.rate || 1) + 1) % r.length]; au.playbackRate = S.rate; save(); renderPlayer(); };
  $("#pPos").oninput = e => au.currentTime = +e.target.value;
}
async function downloadList(list) {
  const st = $("#lDlS"); if (!("caches" in window)) return toast("Máy không hỗ trợ tải offline");
  const c = await caches.open("ccarf-audio"); let ok = 0, fail = 0;
  for (const t of list) {
    const url = new URL(t.file, location.href).pathname;
    if (await c.match(url)) { ok++; continue; }
    try { const r = await fetch(t.file); if (!r.ok) throw 0; await c.put(url, r); ok++; } catch (e) { fail++; }
    if (st) st.textContent = `Đang tải… ${ok + fail}/${list.length}`;
  }
  if (st) st.textContent = fail ? `Đã tải ${ok}/${list.length}. ${fail} file chưa có (audio có thể đang được tạo).` : `✓ Đã tải ${ok} bài, nghe được khi không có mạng.`;
}

/* ========== Boot ========== */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
loadTracks();
const resumeMock = Object.keys(S.mocks).find(id => S.mocks[id].cur != null && !S.mocks[id].done);
render();
if (resumeMock) setTimeout(() => toast(`Mock ${resumeMock} đang làm dở, mở tab Thi thử để tiếp tục`), 400);
</script>
</body>
